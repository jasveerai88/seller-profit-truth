[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seller-profit-truth"
version = "1.0.0"
description = "Etsy and Gumroad sellers: find your real profit per listing after platform fees, shipping and returns — loss-making listings flagged, break-even price calculator included. Local CLI, no uploads, pure Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jasveer Singh" },
]
keywords = [
    "etsy",
    "gumroad",
    "ecommerce",
    "profit",
    "marketplace-fees",
    "pricing",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jasveerai88/seller-profit-truth"
Repository = "https://github.com/jasveerai88/seller-profit-truth"
Issues = "https://github.com/jasveerai88/seller-profit-truth/issues"
Changelog = "https://github.com/jasveerai88/seller-profit-truth/blob/main/CHANGELOG.md"

[project.scripts]
seller-profit-truth = "seller_profit_truth:main"

# The implementation is a single standard-library module in
# src/; it is installed as the top-level module
# `seller_profit_truth`, and `python3 src/seller_profit_truth.py`
# keeps working from a checkout.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["seller_profit_truth"]
